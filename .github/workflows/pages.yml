name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Valeurs publiques côté client (clé publishable, données protégées par la RLS).
          NEXT_PUBLIC_SUPABASE_URL: https://hevradrkdhfntxqcyrbz.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_wwRO_2PBjKoIplL0Ez5CGg_GPogP10p
      - name: Pousser out/ sur la branche gh-pages (servie par GitHub Pages)
        run: |
          touch out/.nojekyll
          cd out
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Publication ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
